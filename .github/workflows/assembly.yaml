name: isoraw test

# auto-run if there are any changes to the assembly source files or the tests
on:
  push:
    paths:
      - .github/workflows/assembly.yaml
      - inst/assembly/src/*
      - inst/assembly/test.sh
      - inst/assembly/tests/**
  pull_request:
     paths:
      - .github/workflows/assembly.yaml
      - inst/assembly/src/*
      - inst/assembly/test.sh
      - inst/assembly/tests/**

env:
  DOTNET_DOCKER: mcr.microsoft.com/dotnet/sdk:8.0
jobs:
  build:
    name: Build Assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull image
        run: docker pull $DOTNET_DOCKER
      - name: Build
        run: cd inst/assembly && docker run --rm -v $PWD:/app -w /app $DOTNET_DOCKER /app/build.sh project=/app output=/app/dist
      - name: Publish results
        uses: actions/upload-artifact@v4
        with:
          name: isoraw
          path: inst/assembly/dist
          retention-days: 1

  verify:
    name: Verify on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: Linux,   os: ubuntu-latest,  exe: ./isoraw-linux-x64}
          - {name: Windows, os: windows-latest, exe: ./isoraw-win-x64.exe}
          - {name: MacOS,   os: macos-latest,   exe: ./isoraw-osx-x64}
    steps:
      - uses: actions/checkout@v4
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: isoraw
      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.config.exe }}
      # runs the same smoke tests as `rake test`, against the freshly built executable
      # (test.sh picks up the raw files in inst/assembly/tests automatically)
      - name: Run smoke tests
        shell: bash
        run: bash inst/assembly/test.sh exe=${{ matrix.config.exe }}

# not uploading the artifacts for releases since not all new releases require new executables
